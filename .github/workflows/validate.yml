name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quests:
    name: Quest files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate FTB Quests SNBT (parse, ids, dependencies, namespaces)
        run: python3 scripts/validate_quests.py
